<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1B2B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>A Última Comporta</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0F1B2B; overflow: hidden; }
      /* Sem rolagem, zoom ou seleção de texto ao tocar no jogo. */
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      /* O jogo estica na largura (telas compridas mostram mais do mapa), mas nunca fica mais alto que 16:9:
         em telas mais "quadradas" sobra uma faixa em cima e embaixo, e a interface continua nas bordas. */
      body { display: flex; align-items: center; justify-content: center; }
      #game { width: 100vw; height: min(100vh, 56.25vw); }
      @supports (height: 100dvh) { #game { height: min(100dvh, 56.25vw); } }
      canvas { display: block; touch-action: none; }

      /* Celular em pé: pede para deitar (o jogo é 16:9). */
      #girar {
        display: none; position: fixed; inset: 0; z-index: 10;
        align-items: center; justify-content: center; flex-direction: column; gap: 16px;
        background: #0F1B2B; color: #EAF1F8; text-align: center; padding: 32px;
        font: 18px/1.4 "Nunito Sans", "Segoe UI", system-ui, sans-serif;
      }
      #girar strong { color: #F2B35E; font: 26px Fraunces, Lora, Georgia, serif; }
      #girar .icone { font-size: 48px; transform: rotate(90deg); }
      @media (orientation: portrait) and (pointer: coarse) {
        #girar { display: flex; }
      }

      /* Tela cheia obrigatória (src/ui/FullscreenGate.ts): o jogo fica pausado esperando. */
      #telacheia {
        display: none; position: fixed; inset: 0; z-index: 9;
        align-items: center; justify-content: center; flex-direction: column; gap: 14px;
        background: rgba(15, 27, 43, 0.94); color: #EAF1F8; text-align: center; padding: 32px;
        font: 18px/1.4 "Nunito Sans", "Segoe UI", system-ui, sans-serif;
      }
      #telacheia.visivel { display: flex; }
      #telacheia strong { color: #F2B35E; font: 600 28px Fraunces, Lora, Georgia, serif; }
      #telacheia svg { width: 56px; height: 56px; image-rendering: pixelated; }
      #telacheia-botao {
        margin-top: 6px; padding: 14px 30px; cursor: pointer;
        background: #F2B35E; color: #2A1A10; border: 3px solid #5A3A24; border-radius: 10px;
        box-shadow: 0 4px 0 #5A3A24; font: 600 20px Fraunces, Lora, Georgia, serif;
      }
      #telacheia-botao:hover { background: #FFC97A; }
      #telacheia-botao:active { transform: translateY(3px); box-shadow: 0 1px 0 #5A3A24; }
      #telacheia .dica { font-size: 14px; color: #9FB2C6; }
      #telacheia .falha { display: none; font-size: 15px; color: #E4725A; }
      #telacheia-janela {
        display: none; background: none; border: 0; cursor: pointer; padding: 4px;
        color: #9FB2C6; text-decoration: underline; font: 15px "Nunito Sans", system-ui, sans-serif;
      }
      #telacheia.falhou .falha, #telacheia.falhou #telacheia-janela { display: block; }
      @media (pointer: coarse) { #telacheia .dica { display: none; } }
    </style>
    <script type="module" crossorigin src="./assets/index-DyOlGkH0.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CfIEo5as.css">
  </head>
  <body>
    <div id="game"></div>
    <div id="girar">
      <div class="icone">📱</div>
      <strong>Gire o celular</strong>
      <span>A Última Comporta se joga com o celular deitado.</span>
    </div>
    <div id="telacheia">
      <svg viewBox="0 0 14 14" aria-hidden="true">
        <path fill="#F2B35E" d="M1 1h5v2H3v3H1zM8 1h5v5h-2V3H8zM1 8h2v3h3v2H1zM11 8h2v5H8v-2h3z" />
      </svg>
      <strong>Tela cheia</strong>
      <span>A Última Comporta é jogada em tela cheia.</span>
      <button id="telacheia-botao" type="button">Entrar em tela cheia</button>
      <span class="dica">ou aperte Enter</span>
      <span class="falha">O navegador não deixou abrir em tela cheia.</span>
      <button id="telacheia-janela" type="button">Jogar na janela mesmo</button>
    </div>
  </body>
</html>
